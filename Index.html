<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orb Dodger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #111;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Fit canvas to mobile viewport
    function resize() {
      canvas.width = Math.min(window.innerWidth, 450);
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Game state
    let score = 0;
    let gameOver = false;
    let items = [];
    let spawnTimer = 0;

    const player = {
      x: canvas.width / 2,
      y: canvas.height - 100,
      radius: 22,
      color: '#4cc9f0'
    };

    // Touch & Drag Controls
    function handlePointer(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const targetX = clientX - rect.left;
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, targetX));

      if (gameOver) {
        resetGame();
      }
    }

    window.addEventListener('touchstart', handlePointer, { passive: true });
    window.addEventListener('touchmove', handlePointer, { passive: true });
    window.addEventListener('mousemove', (e) => { if (e.buttons === 1) handlePointer(e); });

    function resetGame() {
      score = 0;
      items = [];
      gameOver = false;
      player.x = canvas.width / 2;
    }

    function spawnItem() {
      const isHazard = Math.random() > 0.4;
      items.push({
        x: Math.random() * (canvas.width - 30) + 15,
        y: -20,
        radius: isHazard ? 16 : 12,
        speed: Math.random() * 2.5 + 3 + (score * 0.05),
        type: isHazard ? 'hazard' : 'gem',
        color: isHazard ? '#f72585' : '#4ade80'
      });
    }

    function update() {
      if (gameOver) return;

      spawnTimer++;
      if (spawnTimer % 35 === 0) {
        spawnItem();
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed;

        // Collision check
        const dist = Math.hypot(player.x - item.x, player.y - item.y);
        if (dist < player.radius + item.radius) {
          if (item.type === 'hazard') {
            gameOver = true;
          } else {
            score += 10;
            items.splice(i, 1);
            continue;
          }
        }

        // Clean up offscreen items
        if (item.y > canvas.height + 30) {
          items.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Player
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.shadowBlur = 15;
      ctx.shadowColor = player.color;
      ctx.fill();
      ctx.closePath();
      ctx.shadowBlur = 0;

      // Draw Items
      items.forEach(item => {
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
        ctx.fillStyle = item.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = item.color;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;
      });

      // Draw HUD
      ctx.fillStyle = '#ffffff';
      ctx.font = '20px sans-serif';
      ctx.fillText(`Score: ${score}`, 20, 45);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f72585';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#ffffff';
        ctx.font = '16px sans-serif';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillText('Tap anywhere to restart', canvas.width / 2, canvas.height / 2 + 55);
        ctx.textAlign = 'start';
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
